<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan — Warung Cemilan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="laporan" class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

  <div class="min-h-screen lg:flex">
    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col min-w-0 lg:pl-64">
      <div id="topbar"></div>

      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 page-enter space-y-5">
        <!-- Filter -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-3 items-end">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1.5">Dari</label>
              <input id="start-date" type="date" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1.5">Sampai</label>
              <input id="end-date" type="date" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1.5">Kasir</label>
              <select id="f-kasir" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500"></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1.5">Kategori</label>
              <select id="f-cat" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500"></select>
            </div>
            <button id="btn-filter" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/30 transition">
              <i data-lucide="filter" class="w-4 h-4"></i> Tampilkan
            </button>
          </div>
        </div>

        <!-- Ringkasan -->
        <div id="report-summary" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="skeleton h-28 rounded-2xl"></div><div class="skeleton h-28 rounded-2xl"></div><div class="skeleton h-28 rounded-2xl"></div><div class="skeleton h-28 rounded-2xl"></div>
        </div>

        <!-- Grafik + terlaris -->
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
          <div class="xl:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-bold text-gray-900">Grafik Harian</h2>
              <span class="text-xs text-gray-400">Pendapatan per hari</span>
            </div>
            <div class="h-64 relative">
              <div id="rpt-chart-skel" class="skeleton absolute inset-0 rounded-xl"></div>
              <canvas id="report-chart"></canvas>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-bold text-gray-900">Produk Terlaris</h2>
            </div>
            <div id="best-sellers" class="space-y-2.5">
              <div class="skeleton h-12 rounded-xl"></div><div class="skeleton h-12 rounded-xl"></div><div class="skeleton h-12 rounded-xl"></div>
            </div>
            <div id="method-summary" class="mt-5 pt-4 border-t border-gray-100 space-y-2"></div>
          </div>
        </div>

        <!-- Export -->
        <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-center gap-3">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600"><i data-lucide="file-text" class="w-5 h-5"></i></span>
            <div>
              <p class="font-semibold text-gray-800">Ekspor Laporan</p>
              <p class="text-xs text-gray-400">Simpan hasil laporan penjualan</p>
            </div>
          </div>
          <div class="flex gap-3">
            <button id="btn-pdf" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 transition">
              <i data-lucide="file-down" class="w-4 h-4"></i> Export PDF
            </button>
            <button id="btn-excel" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 transition">
              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel
            </button>
          </div>
        </div>
      </main>

      <div id="footer"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/laporan.js"></script>
</body>
</html>
