<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori — Warung Cemilan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="kategori" class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

  <div class="min-h-screen lg:flex">
    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col min-w-0 lg:pl-64">
      <div id="topbar"></div>

      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 page-enter">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="lg:col-span-2">
            <div id="cat-count" class="text-sm text-gray-500 mb-3"></div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="cat-grid">
              <div class="skeleton h-28 rounded-2xl"></div><div class="skeleton h-28 rounded-2xl"></div><div class="skeleton h-28 rounded-2xl"></div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 h-fit">
            <div class="flex items-center gap-3 mb-5">
              <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-blue-100 text-blue-600"><i data-lucide="tags" class="w-5 h-5"></i></span>
              <div>
                <h2 id="form-title" class="font-bold text-gray-900">Tambah Kategori</h2>
                <p class="text-xs text-gray-400">Kelola kelompok produk</p>
              </div>
            </div>

            <form id="cat-form" class="space-y-5" novalidate>
              <input type="hidden" id="cat-id" />
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Nama Kategori <span class="text-red-500">*</span></label>
                <input id="fcat-name" type="text" placeholder="cth: Makanan" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition text-sm" />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Icon</label>
                <div id="cat-icon-picker" class="flex flex-wrap gap-1.5"></div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Warna</label>
                <div id="cat-color-picker" class="flex flex-wrap gap-2"></div>
              </div>

              <div id="cat-form-actions">
                <button type="submit" class="w-full py-2.5 rounded-xl text-white text-sm font-semibold bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/30 transition">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </main>

      <div id="footer"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/kategori.js"></script>
</body>
</html>
