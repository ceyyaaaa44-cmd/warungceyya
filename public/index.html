<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Warung Cemilan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gradient-to-br from-blue-50 via-slate-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl shadow-blue-900/10 border border-gray-100 p-8">
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-blue-400 text-white items-center justify-center shadow-lg shadow-blue-600/30 mb-4">
        <i data-lucide="store" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Warung Cemilan</h1>
      <p class="text-sm text-gray-500 mt-1">Silakan masuk untuk mengakses aplikasi kasir</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 pointer-events-none">
            <i data-lucide="user" class="w-4 h-4"></i>
          </span>
          <input type="text" id="username" required placeholder="Contoh: admin atau kasir1" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-sm outline-none transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">PIN / Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 pointer-events-none">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="password" required placeholder="Masukkan PIN / password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-sm outline-none transition" />
        </div>
      </div>

      <div id="error-msg" class="hidden p-3 rounded-xl bg-red-50 border border-red-100 text-xs text-red-600 font-medium"></div>

      <button type="submit" id="btn-submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2">
        <span>Masuk ke Aplikasi</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <p class="text-xs text-gray-400">Default akun: <span class="font-semibold text-gray-600">admin</span> (password bebas) atau <span class="font-semibold text-gray-600">kasir1</span></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    lucide.createIcons();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');
      
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        const users = data.users || [];
        const found = users.find(u => u.username.toLowerCase() === username.toLowerCase());
        
        if (!found) {
          errEl.textContent = 'Username tidak ditemukan. Coba: admin atau kasir1';
          errEl.classList.remove('hidden');
          return;
        }
        
        if (found.status === 'nonaktif') {
          errEl.textContent = 'Akun ini sedang dinonaktifkan.';
          errEl.classList.remove('hidden');
          return;
        }

        localStorage.setItem('warung_user', JSON.stringify(found));
        window.location.href = 'dashboard.html';
      } catch (err) {
        // Fallback login if offline or API error
        const mockUser = { id: 'usr_mock', name: username, username, role: username === 'admin' ? 'admin' : 'kasir' };
        localStorage.setItem('warung_user', JSON.stringify(mockUser));
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
