<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stok — Warung Cemilan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="stok" class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">

  <div class="min-h-screen lg:flex">
    <div id="sidebar"></div>

    <div class="flex-1 flex flex-col min-w-0">
      <div id="topbar"></div>

      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 page-enter">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="lg:col-span-2 space-y-4">
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 pointer-events-none">
                <i data-lucide="search" class="w-5 h-5"></i>
              </span>
              <input id="stk-search" type="text" placeholder="Cari produk..."
                class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition text-sm" />
            </div>

            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[640px]">
                  <thead>
                    <tr class="text-left text-xs uppercase tracking-wider text-gray-400 border-b border-gray-100 bg-gray-50/60">
                      <th class="px-6 py-3.5 font-semibold">Produk</th>
                      <th class="px-6 py-3.5 font-semibold">Stok Sekarang</th>
                      <th class="px-6 py-3.5 font-semibold text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody id="stock-rows">
                    <tr><td colspan="3" class="px-6 py-8"><div class="skeleton h-10 rounded-lg"></div><div class="skeleton h-10 rounded-lg mt-2"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Riwayat -->
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 h-fit">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h2 class="font-bold text-gray-900">Riwayat Stok</h2>
                <p class="text-xs text-gray-400" id="hist-sub">Semua aktivitas stok</p>
              </div>
              <button id="btn-reset-hist" title="Tampilkan semua" class="p-2 rounded-lg text-gray-400 hover:bg-gray-100 transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              </button>
            </div>
            <div id="stock-history" class="space-y-2.5 max-h-[520px] overflow-y-auto no-scrollbar">
              <div class="skeleton h-12 rounded-xl"></div><div class="skeleton h-12 rounded-xl"></div>
            </div>
          </div>
        </div>
      </main>

      <div id="footer"></div>
    </div>
  </div>

  <!-- Modal penyesuaian stok -->
  <div id="stock-modal" class="fixed inset-0 z-[80] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm overlay-in" data-close></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md modal-card">
      <div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-gray-100">
        <div>
          <h3 id="stock-modal-title" class="text-lg font-bold text-gray-900">Tambah Stok</h3>
          <p class="text-xs text-gray-400" id="stock-modal-product">Produk</p>
        </div>
        <button data-close class="p-2 -mr-2 rounded-lg text-gray-400 hover:bg-gray-100 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="stock-form" class="p-6 space-y-4" novalidate>
        <input type="hidden" id="stock-id" />
        <input type="hidden" id="stock-type" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Jumlah</label>
          <input id="stock-qty" type="number" min="1" placeholder="0" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Keterangan</label>
          <input id="stock-reason" type="text" placeholder="cth: pembelian, rusak, opname"
            class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition text-sm" />
        </div>
        <div class="pt-1 flex justify-end gap-3">
          <button type="button" data-close class="px-4 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl transition">Batal</button>
          <button type="submit" id="btn-stock-save" class="px-5 py-2.5 text-sm font-semibold text-white rounded-xl bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/30 transition">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/stok.js"></script>
</body>
</html>
